[workspace]
resolver = "3"
members = [
	"bjle-engine",
	"bjle-mesh",
	"bjle-shared",
	"bjle-tui",
]

[workspace.dependencies]
# Crate interni
bjle-engine = { path = "bjle-engine" }
bjle-mesh = { path = "bjle-mesh" }
bjle-shared = { path = "bjle-shared" }

# Dipendenze esterne
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bluer = { version = "0.17.4", features = ["bluetoothd"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
sha2 = "0.11.0"
thiserror = "2.0.20"
